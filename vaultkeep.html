<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaultkeep</title>
<!--
  Vaultkeep: open-source, local-first password manager (single file, no server, no dependencies).
  Crypto: PBKDF2-SHA256 (600k iterations) -> AES-256-GCM via the browser's Web Crypto API.
  Each profile has its own master password and its own encrypted vault in IndexedDB (migrated automatically from older localStorage versions).
  License: MIT. Audit it, fork it, improve it.
-->
<style>
:root{--bg:#edf1ef;--panel:#fbfcfb;--ink:#12262a;--mute:#5d7074;--line:#cfd9d6;--acc:#0b6a68;--acc-ink:#fff;--warn:#a8432b;--ok:#2f7a4a;--sel:#dcebe8;
--serif:Georgia,"Iowan Old Style",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a1c;--panel:#152427;--ink:#e3eeec;--mute:#8da4a6;--line:#27393c;--acc:#4fc3bd;--acc-ink:#062022;--warn:#ef8f75;--ok:#6fd09a;--sel:#1d3336;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0 0 .4em}
h1{font-size:2rem}h2{font-size:1.35rem}h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea,select{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
textarea{min-height:4.5rem;resize:vertical}
label{display:block;margin:.7rem 0 .25rem;color:var(--mute);font-size:.85rem}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);padding:.5rem .9rem;border-radius:6px}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.d{color:var(--warn)}
button:hover{filter:brightness(.96)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:1rem}
.gate{max-width:420px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.6rem}
.top{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:.6rem 0 1rem}
.grid{display:grid;grid-template-columns:320px 1fr;gap:1rem}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem}
.list{margin-top:.8rem;display:flex;flex-direction:column;gap:2px;max-height:55vh;overflow:auto}
.item{display:block;text-align:left;width:100%;border:0;background:none;padding:.55rem .6rem;border-radius:6px}
.item.on{background:var(--sel)}
.item small{display:block;color:var(--mute)}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:130px 1fr auto;gap:.5rem;padding:.55rem 0;border-bottom:1px solid var(--line);align-items:center}
.kv span:first-child{color:var(--mute)}
.mono{font-family:var(--mono);word-break:break-all}
.note{padding:.7rem .8rem;border-radius:6px;border:1px solid var(--line);margin-top:.8rem}
.note.no{border-color:var(--warn);color:var(--warn)}
.note.yes{border-color:var(--ok);color:var(--ok)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:.4rem}
.bar i{display:block;height:100%;background:var(--acc)}
.lock{border:1px dashed var(--line);border-radius:8px;padding:.9rem;margin-top:1rem}
.pos{width:3.2rem;text-align:center;font-family:var(--mono)}
.mute{color:var(--mute)}.err{color:var(--warn)}
.hist{margin-top:.9rem;border:1px solid var(--line);border-radius:8px;padding:.5rem .8rem}
.hist summary{cursor:pointer;color:var(--mute);font-size:.9rem}
.hist .kv{grid-template-columns:170px 1fr auto}
.cf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto auto;gap:.4rem;align-items:center;margin-top:.5rem}
.cf-m{display:inline-flex;gap:.3rem;align-items:center;margin:0;white-space:nowrap}.cf-m input{width:auto}
@media(max-width:520px){.cf{grid-template-columns:1fr auto}}
.totp{font-size:1.35rem;letter-spacing:.08em}
.ring{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:4}
.ring circle:first-child{stroke:var(--line)}.ring #totp_ring{stroke:var(--acc);stroke-dasharray:100;transition:stroke-dashoffset 1s linear}
.ring[data-low="1"] #totp_ring{stroke:var(--warn)}
.pill{padding:.2rem .65rem;border-radius:999px;font-size:.82rem}.pill.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.tag{display:inline-block;padding:0 .45rem;border:1px solid var(--line);border-radius:999px;font-size:.75rem;color:var(--mute)}
.star{color:#c9971c}
#kit{display:none}
@media print{
  @page{margin:18mm}
  html,body{background:#fff!important;color:#000!important;font:12pt/1.45 var(--serif)}
  #app{display:none!important}
  #kit{display:block}
  #kit h1{font-size:22pt;margin:0 0 .2em}
  #kit .k-sub{color:#444;margin:0 0 1.2em}
  #kit table{width:100%;border-collapse:collapse;margin:.6em 0 1.2em}
  #kit td{border:1px solid #000;padding:.55em .7em;vertical-align:top}
  #kit td:first-child{width:34%;font-weight:600}
  #kit .k-blank{height:2.6em}
  #kit .k-box{border:2px solid #000;padding:.8em 1em;margin:1em 0;break-inside:avoid}
  #kit ol{padding-left:1.3em}#kit li{margin:.3em 0}
  #kit .k-foot{margin-top:2em;font-size:9pt;color:#444;border-top:1px solid #000;padding-top:.5em}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="kit" aria-hidden="true"></div>
<script>
const enc=new TextEncoder(),dec=new TextDecoder();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const uid=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>x.toString(16).padStart(2,'0')).join('');
/* ---------- storage: IndexedDB with in-memory mirror, localStorage fallback ----------
   All encrypted profile records live in IndexedDB (db "vaultkeep", store "profiles", key = profile name).
   load() is synchronous and reads the mirror; store() updates the mirror and persists atomically.
   Legacy "vaultkeep.v1" localStorage data is migrated once and removed only after a verified write. */
const LEGACY_KEY='vaultkeep.v1',IDB_NAME='vaultkeep',IDB_STORE='profiles';
let DB={},idb=null;
const idbReq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idbTx=(mode,fn)=>new Promise((ok,no)=>{const t=idb.transaction(IDB_STORE,mode),s=t.objectStore(IDB_STORE);const out=fn(s);
  t.oncomplete=()=>ok(out);t.onerror=t.onabort=()=>no(t.error||new Error('IndexedDB transaction failed'))});
async function idbOpen(){
  if(typeof indexedDB==='undefined')throw new Error('IndexedDB unavailable');
  const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);
  const db=await idbReq(r);db.onversionchange=()=>db.close();return db;
}
async function idbReadAll(){
  const o={};await idbTx('readonly',s=>{const c=s.openCursor();c.onsuccess=()=>{const k=c.result;if(k){o[k.key]=k.value;k.continue()}}});return o;
}
const legacyLoad=()=>{try{return JSON.parse(localStorage.getItem(LEGACY_KEY))||{}}catch{return{}}};
async function initStorage(){
  try{
    idb=await idbOpen();DB=await idbReadAll();
    const legacy=legacyLoad(),missing=Object.keys(legacy).filter(n=>!(n in DB));
    if(missing.length){
      await idbTx('readwrite',s=>missing.forEach(n=>s.put(legacy[n],n)));
      const check=await idbReadAll();
      if(missing.every(n=>JSON.stringify(check[n])===JSON.stringify(legacy[n]))){DB=check;localStorage.removeItem(LEGACY_KEY)}
      else throw new Error('Migration verification failed');
    }else if(localStorage.getItem(LEGACY_KEY)!==null&&Object.keys(legacy).every(n=>JSON.stringify(DB[n])===JSON.stringify(legacy[n])))localStorage.removeItem(LEGACY_KEY);
    S.storage='indexeddb';
  }catch(err){idb=null;DB=legacyLoad();S.storage='localstorage';console.warn('Vaultkeep: falling back to localStorage',err)}
}
const load=()=>structuredClone(DB);
async function store(o){
  const prev=DB;DB=structuredClone(o);
  try{
    if(idb)await idbTx('readwrite',s=>{s.clear();for(const [n,v] of Object.entries(DB))s.put(v,n)});
    else localStorage.setItem(LEGACY_KEY,JSON.stringify(DB));
  }catch(err){DB=prev;alert('Could not save to browser storage ('+(err?.name||'error')+'). Export a backup and use a normal browser window.');throw err}
}

let S={name:null,key:null,salt:null,master:'',entries:[],sel:null,view:'home',open:{},fails:0,lockUntil:0,chal:null,last:Date.now(),
  g:{mode:'chars',len:20,up:1,lo:1,di:1,sy:1,am:1,words:5,sep:'-',cap:0,num:0}};

/* ---------- crypto ---------- */
async function derive(pw,salt){
  const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},S.key,enc.encode(JSON.stringify(S.entries)));
  const all=load();all[S.name]={salt:b64(S.salt),iv:b64(iv),ct:b64(ct),created:all[S.name]?.created||Date.now()};await store(all);
}
async function unlockProfile(name,pw){
  const rec=load()[name];const salt=ub64(rec.salt);const key=await derive(pw,salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(rec.iv)},key,ub64(rec.ct));
  Object.assign(S,{name,key,salt,master:pw,entries:JSON.parse(dec.decode(pt)),sel:null,view:'home',open:{},fails:0,lockUntil:0,last:Date.now()});
}

/* ---------- generator ---------- */
function rnd(n){const m=Math.floor(2**32/n)*n;let x;do{x=crypto.getRandomValues(new Uint32Array(1))[0]}while(x>=m);return x%n}
function genSets(o){
  const f=s=>o.am?s.replace(/[lIO01|]/g,''):s;
  const a=[];if(o.lo)a.push(f('abcdefghijklmnopqrstuvwxyz'));if(o.up)a.push(f('ABCDEFGHIJKLMNOPQRSTUVWXYZ'));
  if(o.di)a.push(f('0123456789'));if(o.sy)a.push('!@#$%^&*()-_=+[]{};:,.?');return a;
}
function gen(o=S.g){
  const sets=genSets(o);if(!sets.length)return'';const pool=sets.join('');const out=sets.map(s=>s[rnd(s.length)]);
  while(out.length<o.len)out.push(pool[rnd(pool.length)]);
  for(let i=out.length-1;i>0;i--){const j=rnd(i+1);[out[i],out[j]]=[out[j],out[i]]}
  return out.slice(0,o.len).join('');
}
const bits=(o=S.g)=>o.mode==='words'?phraseBits(o):Math.round(o.len*Math.log2(Math.max(2,genSets(o).join('').length)));
/* Passphrase (Diceware-style) using the EFF Short Wordlist #1 (CC BY 3.0, eff.org/dice); yo-yo dropped as it duplicates yoyo and contains a separator. */

live omen onion only ooze opal open opera opt otter ouch ounce outer oval oven owl ozone pace pagan pager palm panda panic pants panty paper park party pasta patch path patio payer pecan penny pep perch perky perm pest petal petri petty photo plank plant plaza plead plot plow pluck plug plus poach pod poem poet pogo point poise poker polar polio polka polo pond pony poppy pork poser pouch pound pout power prank press print prior prism prize probe prong proof props prude prune pry pug pull pulp pulse puma punch punk pupil puppy purr purse push putt quack quake query quiet quill quilt quit quota quote rabid race rack radar radio raft rage raid rail rake rally ramp ranch range rank rant rash raven reach react ream rebel recap relax relay relic remix repay repel reply rerun reset rhyme rice rich ride rigid rigor rinse riot ripen rise risk ritzy rival river roast robe robin rock rogue roman romp rope rover royal ruby rug ruin rule runny rush rust rut sadly sage said saint salad salon salsa salt same sandy santa satin sauna saved savor sax say scale scam scan scare scarf scary scoff scold scoop scoot scope score scorn scout scowl scrap scrub scuba scuff sect sedan self send sepia serve set seven shack shade shady shaft shaky sham shape share sharp shed sheep sheet shelf shell shine shiny ship shirt shock shop shore shout shove shown showy shred shrug shun shush shut shy sift silk silly silo sip siren sixth size skate skew skid skier skies skip skirt skit sky slab slack slain slam slang slash slate slaw sled sleek sleep sleet slept slice slick slimy sling slip slit slob slot slug slum slurp slush small smash smell smile smirk smog snack snap snare snarl sneak sneer sniff snore snort snout snowy snub snuff speak speed spend spent spew spied spill spiny spoil spoke spoof spool spoon sport spot spout spray spree spur squad squat squid stack staff stage stain stall stamp stand stank stark start stash state stays steam steep stem step stew stick sting stir stock stole stomp sto const SEPS=[['-','Hyphen -'],['.','Dot .'],['_','Underscore _'],[' ','Space'],['','None']];
function genPhrase(o=S.g){
  const w=Array.from({length:o.words},()=>WORDS[rnd(WORDS.length)]).map(x=>o.cap?x[0].toUpperCase()+x.slice(1):x);
  if(o.num){const i=rnd(w.length);w[i]+=rnd(10)}
  return w.join(o.sep);
}
const phraseBits=o=>Math.round(o.words*Math.log2(WORDS.length)+(o.num?Math.log2(10*o.words):0));
const genAny=(o=S.g)=>o.mode==='words'?genPhrase(o):gen(o);
const strength=b=>b<60?'Weak':b<80?'Fair':b<110?'Strong':'Excellent';
// Character-pool estimate for an arbitrary password (upper bound; repeated chars reduce it).
function pwBits(p){
  p=String(p||'');if(!p)return 0;let n=0;
  if(/[a-z]/.test(p))n+=26;if(/[A-Z]/.test(p))n+=26;if(/[0-9]/.test(p))n+=10;if(/[^a-zA-Z0-9]/.test(p))n+=33;
  const uniq=new Set(p).size;return Math.round(Math.min(p.length,uniq*1.5)*Math.log2(Math.max(2,n)));
}

/* ---------- vault health audit (fully offline) ---------- */
const STALE_DAYS=180;
function audit(){
  const by=new Map();S.entries.forEach(e=>{if(e.password){const a=by.get(e.password)||[];a.push(e);by.set(e.password,a)}});
  const reused=[...by.values()].filter(a=>a.length>1);
  const weak=S.entries.filter(e=>e.password&&pwBits(e.password)<60);
  const noId=S.entries.filter(e=>(e.type||'login')==='login'&&!e.username&&!e.email);
  const cut=Date.now()-STALE_DAYS*864e5;
  const stale=S.entries.filter(e=>e.password&&(e.pwChanged||e.created||0)<cut);
  const bad=new Set([...reused.flat(),...weak,...stale].map(e=>e.id));
  const score=S.entries.length?Math.round(100*(S.entries.length-bad.size)/S.entries.length):100;
  return{reused,weak,noId,stale,score};
}
function auditView(){
  const a=audit(),link=e=>`<button class="item" onclick="S.sel='${e.id}';S.view='detail';render()">${esc(e.service)}<small>${esc(e.username||e.email||'')}</small></button>`;
  const sec=(t,d,items,body)=>`<div class="note ${items.length?'no':'yes'}"><strong>${t} (${items.length})</strong><div class="mute" style="font-size:.85rem">${d}</div>${items.length?body:''}</div>`;
  return `<div class="card"><h2>Vault health</h2><p class="mute">Analysed on this device only. Nothing is sent anywhere.</p>
  <div class="bar"><i style="width:${a.score}%"></i></div><p><strong>${a.score}%</strong> of your ${S.entries.length} entries have no password issues.</p>
  ${sec('Reused passwords','The same password is used on more than one service. One breach exposes all of them.',a.reused,a.reused.map((g,i)=>`<div style="margin-top:.5rem"><span class="mute">Group ${i+1}</span>${g.map(link).join('')}</div>`).join(''))}
  ${sec('Weak passwords','Estimated under 60 bits of entropy. Replace with a generated password.',a.weak,a.weak.map(e=>link(e).replace('</small>',` · ~${pwBits(e.password)} bits</small>`)).join(''))}
  ${sec('Not changed in '+STALE_DAYS+'+ days','Old passwords are more likely to have leaked. Consider rotating them.',a.stale,a.stale.map(e=>link(e).replace('</small>',` · since ${new Date(e.pwChanged||e.created).toLocaleDateString()}</small>`)).join(''))}
  ${sec('Missing username or email','You may not know which account this password belongs to.',a.noId,a.noId.map(link).join(''))}</div>`;
}

/* ---------- helpers ---------- */
const norm=s=>String(s).toLowerCase().trim().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'').replace(/\.(com|org|net|io|ai|app|co)$/,'');
const sel=()=>S.entries.find(e=>e.id===S.sel);
async function copy(t){
  try{await navigator.clipboard.writeText(t);toast('Copied. Clipboard clears in 20 seconds.');
  setTimeout(()=>navigator.clipboard.writeText('').catch(()=>{}),20000)}catch{toast('Copy blocked by the browser. Use Show instead.')}
}
function toast(m){const t=$('#toast');if(t){t.textContent=m;setTimeout(()=>{if(t.textContent===m)t.textContent=''},4000)}}
/* ---------- device settings (non-secret, stored unencrypted) ---------- */
const SETTINGS_KEY='vaultkeep.settings';
const LOCK_OPTS=[[1,'1 minute'],[3,'3 minutes'],[5,'5 minutes'],[15,'15 minutes'],[0,'Never']];
const cfg=()=>{try{return{lockMin:3,escLock:1,...JSON.parse(localStorage.getItem(SETTINGS_KEY))}}catch{return{lockMin:3,escLock:1}}};
const setCfg=p=>{try{localStorage.setItem(SETTINGS_KEY,JSON.stringify({...cfg(),...p}))}catch{}};
const lockLabel=()=>{const m=cfg().lockMin;return m?`auto-locks after ${m} idle minute${m>1?'s':''}`:'auto-lock off'};
function lockApp(){
  Object.assign(S,{key:null,salt:null,master:'',entries:[],name:null,sel:null,view:'home',open:{},chal:null,_f:null,_gp:null,filter:'all',pending:null});
  $('#kit').innerHTML='';render();
}
['click','keydown','mousemove','touchstart'].forEach(e=>addEventListener(e,()=>S.last=Date.now(),{passive:true}));
setInterval(()=>{const m=cfg().lockMin;if(S.key&&m&&Date.now()-S.last>m*60000)lockApp()},5000);
addEventListener('keydown',e=>{
  if(!S.key)return;
  const t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&e.key.toLowerCase()==='l'){e.preventDefault();lockApp();return}
  if(e.key==='Escape'&&cfg().escLock){if(typing){t.blur();return}e.preventDefault();lockApp()}
});

/* ---------- breach check (k-anonymity, Have I Been Pwned) ---------- */
// Only the first 5 hex chars of SHA-1(password) leave the device; suffix matching happens locally.
async function pwnedCount(pw){
  const h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-1',enc.encode(pw))),x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();
  const pre=h.slice(0,5),suf=h.slice(5);
  const r=await fetch('https://api.pwnedpasswords.com/range/'+pre,{headers:{'Add-Padding':'true'},cache:'no-store',referrerPolicy:'no-referrer',credentials:'omit'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  for(const line of (await r.text()).split('\n')){const [s,c]=line.trim().split(':');if(s===suf)return parseInt(c,10)||0}
  return 0;
}
async function checkPwned(){
  const e=sel(),box=$('#pwn');if(!e||!box)return;
  box.className='note';box.textContent='Checking… only a 5-character hash prefix is sent.';
  try{const n=await pwnedCount(e.password);if(sel()?.id!==e.id)return;
    box.className='note '+(n?'no':'yes');
    box.textContent=n?`This password appears in ${n.toLocaleString()} known data breaches. Change it on ${e.service} and here.`:'Not found in any known breach.';
  }catch{box.className='note no';box.textContent='Could not reach the breach database. Check your connection and try again.'}
}

/* ---------- TOTP / 2FA (RFC 6238 over RFC 4226 HOTP, Web Crypto HMAC) ---------- */
function b32decode(s){
  const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';s=String(s).toUpperCase().replace(/[\s=-]/g,'');
  let bitsN=0,val=0;const out=[];
  for(const ch of s){const i=A.indexOf(ch);if(i<0)throw new Error('Invalid base32');val=(val<<5)|i;bitsN+=5;if(bitsN>=8){out.push((val>>>(bitsN-8))&255);bitsN-=8}}
  return new Uint8Array(out);
}
// Accepts a raw base32 secret or an otpauth://totp/... URI.
function parseTotp(input){
  const s=String(input||'').trim();if(!s)return null;
  let o={secret:s,digits:6,period:30,algo:'SHA-1'};
  if(/^otpauth:\/\//i.test(s)){
    const u=new URL(s);if(u.host.toLowerCase()!=='totp')throw new Error('Only TOTP is supported');
    const p=u.searchParams,a=(p.get('algorithm')||'SHA1').toUpperCase().replace('SHA','SHA-');
    o={secret:p.get('secret')||'',digits:+(p.get('digits')||6),period:+(p.get('period')||30),algo:a};
  }
  if(!['SHA-1','SHA-256','SHA-512'].includes(o.algo)||![6,7,8].includes(o.digits)||!(o.period>0))throw new Error('Unsupported TOTP parameters');
  o.key=b32decode(o.secret);if(!o.key.length)throw new Error('Empty secret');
  return o;
}
async function totpCode(input,now=Date.now()){
  const o=parseTotp(input),ctr=Math.floor(now/1000/o.period),msg=new Uint8Array(8);
  let c=ctr;for(let i=7;i>=0;i--){msg[i]=c&255;c=Math.floor(c/256)}
  const k=await crypto.subtle.importKey('raw',o.key,{name:'HMAC',hash:o.algo},false,['sign']);
  const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,msg)),off=h[h.length-1]&15;
  const bin=((h[off]&127)<<24)|(h[off+1]<<16)|(h[off+2]<<8)|h[off+3];
  return{code:String(bin%10**o.digits).padStart(o.digits,'0'),left:o.period-Math.floor(now/1000)%o.period,period:o.period};
}

    const r=document.getElementById('totp_ring');if(r){r.style.strokeDashoffset=String(100-100*t.left/t.period);r.parentNode.dataset.low=t.left<=5?1:''}
    const l=document.getElementById('totp_left');if(l)l.textContent=t.left+'s';
  }catch(err){el.textContent='Invalid secret'}
}

/* ---------- CSV importer (Bitwarden, KeePass/KeePassXC, 1Password, Chrome, Firefox, generic) ---------- */
function parseCSV(text){
  text=String(text).replace(/^\uFEFF/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"'&&f==='')q=true;
    else if(c===',' ){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);if(row.length>1||row[0]!=='')rows.push(row)}
  return rows;
}
const CSV_COLS={
  service:['name','title','account'],url:['url','login_uri','web site','website','login url'],
  username:['username','login_username','login name','user name','login'],password:['password','login_password'],
  totp:['login_totp','totp','otpauth','one-time password'],notes:['notes','note','comments','extra'],
  tags:['folder','group','tags'],fav:['favorite','favourite'],type:['type'],
  fields:['fields'],created:['timecreated','created','creation time'],changed:['timepasswordchanged','last modified','password last modified']
};
function detectFormat(h){
  const has=k=>h.includes(k);
  return has('login_password')?'Bitwarden':has('httprealm')||has('formactionorigin')?'Firefox':has('group')&&has('title')||has('login name')?'KeePass':
    has('otpauth')||has('archived')?'1Password':h.join()==='name,url,username,password'||h.join()==='name,url,username,password,note'?'Chrome':'Generic CSV';
}
const toTime=v=>{if(!v)return 0;const n=+v;if(n>1e11)return n;const d=Date.parse(v);return isNaN(d)?0:d};
function csvToEntries(text){
  const rows=parseCSV(text);if(rows.length<2)throw new Error('The file has no data rows.');
  const h=rows[0].map(x=>x.trim().toLowerCase()),fmt=detectFormat(h);
  const idx={};for(const [k,al] of Object.entries(CSV_COLS))idx[k]=h.findIndex(x=>al.includes(x));
  if(idx.password<0&&idx.notes<0)throw new Error('No password column found. Is this a password export?');
  const out=[];
  for(const r of rows.slice(1)){
    const g=k=>idx[k]>=0?(r[idx[k]]||'').trim():'',pw=idx.password>=0?(r[idx.password]||''):'';
    const url=g('url'),bwType=g('type').toLowerCase();
    let host='';try{host=url?new URL(/^[a-z][\w+.-]*:\/\//i.test(url)?url:'https://'+url).hostname.replace(/^www\./,''):''}catch{}
    if(/^(chrome|about|moz-extension):/i.test(url))continue;
    const type=bwType==='note'||bwType==='securenote'?'note':bwType==='card'?'card':bwType==='identity'?'note':'login';
    const service=g('service')||host||url;if(!service&&!pw)continue;
    const user=g('username'),isMail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(user);
    const fields=[];if(url)fields.push({label:'URL',value:url,masked:0});
    if(g('fields'))g('fields').split(/\r?\n/).forEach(l=>{const m=l.match(/^([^:]+):\s?(.*)$/);if(m)fields.push({label:m[1].trim(),value:m[2],masked:1})});
    let totp=g('totp');if(totp){try{parseTotp(totp)}catch{fields.push({label:'TOTP',value:totp,masked:1});totp=''}}
    const created=toTime(g('created'))||Date.now();
    out.push({type,service:service||'(untitled)',username:isMail?'':user,email:isMail?user:'',password:pw,totpSecret:totp,
      recEmail:'',qa:'',notes:g('notes'),fields,tags:parseTags(g('tags').replace(/[\\/]/g,',')),fav:/^(1|true|yes)$/i.test(g('fav'))?1:0,
      created,pwChanged:toTime(g('changed'))||created,history:[]});
  }
  return{fmt,entries:out};
}
async function importEntries(list){
  const key=e=>[e.service.toLowerCase(),e.username,e.email,e.password].join('\u0000'),seen=new Set(S.entries.map(key));
  let added=0,dup=0;
  for(const e of list){if(seen.has(key(e))){dup++;continue}seen.add(key(e));S.entries.push({...e,id:uid()});added++}
  if(added)await seal();
  return{added,dup};
}
async function importCSV(file,input){
  if(!file)return;const box=$('#imp');
  try{
    const {fmt,entries}=csvToEntries(await file.text());
    if(!S.key){S.pending={fmt,entries};render();return}
    const {added,dup}=await importEntries(entries);
    render();toast(`Imported ${added} entr${added===1?'y':'ies'} from ${fmt}${dup?`, skipped ${dup} duplicate${dup>1?'s':''}`:''}. Delete the CSV file now: it is unencrypted.`);
  }catch(err){if(box){box.className='note no';box.textContent='Import failed: '+(err.message||err)}}
  finally{if(input)input.value=''}
}
async function flushPending(){
  if(!S.pending||!S.key)return;const p=S.pending;S.pending=null;
  const {added,dup}=await importEntries(p.entries);render();
  toast(`Imported ${added} entr${added===1?'y':'ies'} from ${p.fmt}${dup?`, skipped ${dup} duplicates`:''}. Delete the CSV file now: it is unencrypted.`);
}

function formView(){
  const f=S._f,editing=!!f.id,T=f.type||'login';
  const inp=(k,l,t='text')=>`<label for="f_${k}">${l}</label><input id="f_${k}" type="${t}" value="${esc(f[k])}" autocomplete="off">`;
  return `<div class="card"><h2>${editing?'Edit':'New'} ${TYPES[T].toLowerCase()}</h2>
  <label for="f_type">Type</label><select id="f_type" onchange="applyType(this.value)">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${T===k?'selected':''}>${l}</option>`).join('')}</select>
  ${inp('service',T==='login'?'Service':'Name')}${inp('username','Username')}${inp('email','Account email')}
  <label for="f_password">Password${T==='login'?'':' (optional)'}</label><div class="row"><input id="f_password" class="mono" style="flex:1" value="${esc(f.password)}"><button onclick="document.getElementById('f_password').value=genAny();">Generate</button></div>
  <label for="f_totpSecret">2FA secret (optional, base32 key or otpauth:// link)</label><input id="f_totpSecret" class="mono" value="${esc(f.totpSecret)}" autocomplete="off" spellcheck="false" placeholder="JBSW Y3DP EHPK 3PXP">
  <label for="f_tags">Tags (comma separated)</label><input id="f_tags" value="${esc((f.tags||[]).join(', '))}" autocomplete="off" placeholder="work, finance">
  <label style="display:flex;gap:.5rem;align-items:center"><input id="f_fav" type="checkbox" style="width:auto" ${f.fav?'checked':''}>★ Favorite (pin to top)</label>

  <h3 style="margin-top:1.2rem">Protected details</h3><p class="mute" style="margin:0">Shown only after the master-password check.</p>
  ${inp('recEmail','Recovery email or phone')}
  <label for="f_qa">Security questions (one per line: question | answer)</label><textarea id="f_qa">${esc(f.qa)}</textarea>
  <label for="f_notes">Notes</label><textarea id="f_notes">${esc(f.notes)}</textarea>
  <h3 style="margin-top:1.2rem">Custom fields</h3><p class="mute" style="margin:0;font-size:.85rem">PINs, server ports, API tokens, license keys… Masked fields are hidden until you click Show.</p>
  ${(f.fields||[]).map((c,i)=>`<div class="cf"><input id="cf_l_${i}" placeholder="Label, e.g. PIN" value="${esc(c.label)}" autocomplete="off" aria-label="Field ${i+1} label">
  <input id="cf_v_${i}" class="mono" placeholder="Value" value="${esc(c.value)}" type="${c.masked?'password':'text'}" autocomplete="off" aria-label="Field ${i+1} value">
  <label class="cf-m"><input id="cf_m_${i}" type="checkbox" ${c.masked?'checked':''} onchange="document.getElementById('cf_v_${i}').type=this.checked?'password':'text'">Masked</label>
  <button class="d" onclick="readForm();S._f.fields.splice(${i},1);drawRight()" aria-label="Remove field ${i+1}">✕</button></div>`).join('')}
  <button style="margin-top:.6rem" onclick="readForm();S._f.fields.push({label:'',value:'',masked:1});drawRight()">Add field</button>
  <div class="row" style="margin-top:1rem"><button class="p" onclick="saveEntry()">Save</button><button onclick="S.view=S._f.id?'detail':'home';render()">Cancel</button></div></div>`;
}
const FORM_KEYS=['type','service','username','email','password','totpSecret','recEmail','qa','notes'];
// Pull the current form inputs back into S._f so re-rendering (e.g. adding a field) loses nothing.
function readForm(){
  const f=S._f,v=id=>document.getElementById(id);
  FORM_KEYS.forEach(k=>{const el=v('f_'+k);if(el)f[k]=el.value});
  if(v('f_tags'))f.tags=parseTags(v('f_tags').value);
  if(v('f_fav'))f.fav=v('f_fav').checked?1:0;
  f.fields=(f.fields||[]).map((c,i)=>v('cf_l_'+i)?{label:v('cf_l_'+i).value,value:v('cf_v_'+i).value,masked:v('cf_m_'+i).checked?1:0}:c);
  return f;
}
async function saveEntry(){
  const f=readForm();
  if(!f.service.trim())return toast('A name is required.');
  if((f.type||'login')==='login'&&!f.password)return toast('Logins need a password.');
  f.totpSecret=(f.totpSecret||'').trim();
  if(f.totpSecret)try{parseTotp(f.totpSecret)}catch(err){return toast('2FA secret is not valid: '+err.message)}
  const e={...f,service:f.service.trim(),username:f.username.trim(),email:f.email.trim(),recEmail:f.recEmail.trim(),
    fields:f.fields.map(c=>({...c,label:c.label.trim()})).filter(c=>c.label||c.value)};
  const prev=e.id&&S.entries.find(x=>x.id===e.id);
  if(prev&&prev.password&&prev.password!==e.password){
    e.history=[{password:prev.password,changedAt:Date.now()},...(prev.history||[])].slice(0,HISTORY_MAX);e.pwChanged=Date.now();
  }
  if(e.id)S.entries=S.entries.map(x=>x.id===e.id?e:x);else{e.id=uid();e.created=e.pwChanged=Date.now();e.history=[];S.entries.push(e)}
  await seal();S.sel=e.id;S.view='detail';render();toast('Saved and encrypted.');
}
async function delEntry(){if(!confirm('Delete this service permanently?'))return;S.entries=S.entries.filter(e=>e.id!==S.sel);S.sel=null;S.view='home';await seal();render()}
function detailView(e){
  const open=(S.open[e.id]||0)>Date.now();
  const kv=(l,v,c)=>`<div class="kv"><span>${l}</span><span class="mono">${esc(v||'—')}</span><span>${c||''}</span></div>`;
  const cp=(id)=>`<button onclick="copy(sel().${id})">Copy</button>`;
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(e.service)}</h2><div class="row"><button onclick="toggleFav()" aria-pressed="${e.fav?'true':'false'}" title="Pin to the top of the list">${e.fav?'★ Favorite':'☆ Favorite'}</button><button onclick="editEntry()">Edit</button><button class="d" onclick="delEntry()">Delete</button></div></div>
  ${(e.type||'login')!=='login'||(e.tags||[]).length?`<div class="row" style="gap:.3rem;margin-top:.4rem"><span class="tag">${TYPES[e.type||'login']}</span>${(e.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>`:''}
  <p class="mute">Saved ${new Date(e.created).toLocaleDateString()}</p>
  ${kv('Username',e.username,e.username?cp('username'):'')}${kv('Account email',e.email,e.email?cp('email'):'')}
  <div class="kv"><span>Password</span><span class="mono" id="pw">••••••••••••</span><span class="row"><button onclick="const p=$('#pw');p.textContent=p.dataset.s?'••••••••••••':sel().password;p.dataset.s=p.dataset.s?'':1">Show</button><button onclick="copy(sel().password)">Copy</button></span></div>
  ${totpHtml(e)}
  <div class="row" style="margin-top:.6rem"><button onclick="checkPwned()" title="Sends only the first 5 characters of the password's SHA-1 hash to api.pwnedpasswords.com">Check pwned</button><span class="mute" style="font-size:.85rem">Optional online check. Your password never leaves this device.</span></div><div id="pwn" role="status"></div>
  ${(e.fields||[]).map((c,i)=>`<div class="kv"><span>${esc(c.label||'Field '+(i+1))}</span><span class="mono" id="cfv_${i}">${c.masked?'••••••••':esc(c.value||'—')}</span><span class="row">
  ${c.masked?`<button onclick="const p=$('#cfv_${i}');p.textContent=p.dataset.s?'••••••••':sel().fields[${i}].value;p.dataset.s=p.dataset.s?'':1">Show</button>`:''}${c.value?`<button onclick="copy(sel().fields[${i}].value)">Copy</button>`:''}</span></div>`).join('')}
  ${historyHtml(e)}
  ${open?`<div class="lock"><h3>Protected details <span class="mute" style="font-size:.8rem">(open until ${new Date(S.open[e.id]).toLocaleTimeString()})</span></h3>
  ${kv('Recovery',e.recEmail)}<div class="kv"><span>Security Q&amp;A</span><span class="mono" style="white-space:pre-wrap">${esc(e.qa||'—')}</span><span></span></div>${kv('Notes',e.notes)}
  <button onclick="delete S.open['${e.id}'];drawRight()">Hide now</button></div>`:challenge(e)}</div>`;
}
function challenge(e){
  const wait=Math.ceil((S.lockUntil-Date.now())/1000);
  if(wait>0)return `<div class="lock"><h3>Protected details</h3><p class="err">Too many wrong answers. Try again in ${wait}s.</p><button onclick="drawRight()">Refresh</button></div>`;
  if(!S.chal){const p=new Set;while(p.size<3)p.add(rnd(S.master.length));S.chal=[...p].sort((a,b)=>a-b)}
  return `<div class="lock"><h3>Protected details are locked</h3><p class="mute">Recovery info and security answers need two checks: your full master password, and three of its characters at random positions.</p>
  <label for="c_m">Master password</label><input id="c_m" type="password" autocomplete="off">
  <div class="row" style="margin-top:.7rem">${S.chal.map((p,i)=>`<label style="margin:0">#${p+1} <input class="pos" id="c_${i}" maxlength="1" autocomplete="off"></label>`).join('')}</div>
  <p class="err" id="ce2"></p><button class="p" onclick="verify('${e.id}')">Unlock for 30 seconds</button></div>`;
}
function verify(id){
  const ok=$('#c_m').value===S.master&&S.chal.every((p,i)=>document.getElementById('c_'+i).value===S.master[p]);
  S.chal=null;
  if(ok){S.fails=0;S.open[id]=Date.now()+30000;drawRight();setTimeout(drawRight,30500);return}
  S.fails++;if(S.fails>=3)S.lockUntil=Date.now()+30000*2**(S.fails-3);
  drawRight();const e=$('#ce2');if(e)e.textContent='Those answers do not match.';
}
function exportBackup(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({vaultkeep:1,profile:S.name,data:load()[S.name]})],{type:'application/json'}));
  a.download=`vaultkeep-${S.name}.json`;a.click();toast('Encrypted backup downloaded. It is useless without your master password.');
}
/* ---------- emergency kit ---------- */
function kitHtml(){
  const rec=load()[S.name]||{},made=rec.created?new Date(rec.created).toLocaleDateString():'Not recorded (profile predates this feature)';
  const row=(l,v)=>`<tr><td>${l}</td><td${v?'':' class="k-blank"'}>${v?esc(v):''}</td></tr>`;
  return `<h1>Vaultkeep Emergency Kit</h1><p class="k-sub">Keep this sheet somewhere safe and offline. Anyone holding it and your backup file can open your vault.</p>
  <table>${row('Profile name',S.name)}${row('Profile created',made)}${row('Kit printed',new Date().toLocaleString())}${row('App','Vaultkeep (vaultkeep.html), runs offline in any modern browser')}</table>
  <div class="k-box"><strong>Master password</strong> (write by hand, never type it into a file)<table>${row('Master password','')}${row('Hint (optional)','')}</table></div>
  <div class="k-box"><strong>Where things are kept</strong><table>${row('Encrypted backup file location','')}${row('Copy of vaultkeep.html location','')}${row('Physical location of this kit','')}</table></div>
  <h3>How to recover your vault</h3><ol>
  <li>Open a copy of <em>vaultkeep.html</em> in a modern browser (Chrome, Firefox, Edge, Safari). No internet connection is needed.</li>
  <li>On the start screen choose <em>Restore a backup</em> and select your <em>vaultkeep-${esc(S.name)}.json</em> file.</li>
  <li>Select the restored profile and enter the master password written above.</li>
  <li>Export a fresh backup after recovery and store it in at least two places.</li></ol>
  <p><strong>There is no password reset.</strong> Without the master password the backup cannot be decrypted by anyone, including the Vaultkeep authors.</p>
  <p class="k-foot">Generated locally by Vaultkeep. This sheet contains no stored passwords.</p>`;
}
function printKit(){const k=$('#kit');k.innerHTML=kitHtml();window.print();setTimeout(()=>k.innerHTML='',1000)}
async function importBackup(f){
  if(!f)return;let j;try{j=JSON.parse(await f.text());if(!j.vaultkeep||!j.data||!j.data.ct)throw 0}catch{return alert('That file is not a Vaultkeep backup.')}
  const all=load();let n=j.profile||'Restored';while(all[n])n+=' (restored)';all[n]=j.data;
  try{await store(all)}catch{return}
  render();alert('Restored as profile “'+n+'”.');
}
$('#app').innerHTML='<p class="mute" style="text-align:center;margin-top:20vh">Opening vault storage…</p>';
initStorage().then(()=>{navigator.storage?.persist?.().catch(()=>{});render()});
</script>
</body>
