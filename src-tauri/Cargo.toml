[package]
name = "vaultkeep"
version = "1.0.0"
description = "Vaultkeep local-first zero-knowledge password manager"
authors = ["shehabgamal <shehab.gamal333@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vaultkeep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
